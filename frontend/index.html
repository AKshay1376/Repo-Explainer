    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repo Explainer — AI-powered GitHub codebase analysis</title>
    <meta name="description" content="Understand any public repository architecture, entry points, technology stack, and component responsibilities in seconds." />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
